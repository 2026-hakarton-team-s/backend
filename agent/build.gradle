// =====================================================================
// DepScan Agent 모듈
// - 외부 라이브러리 없이 JDK 의 java.lang.instrument 만 사용합니다.
// - 빌드 결과: agent/build/libs/depscan-agent.jar
//
// 사용법:
//   java -javaagent:depscan-agent.jar -jar 분석대상앱.jar
//   java -javaagent:depscan-agent.jar=output=결과파일.txt -jar 분석대상앱.jar
// =====================================================================

dependencies {
    // 의존성 없음 (JDK 표준 API만 사용)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    // 파일 이름을 depscan-agent.jar 로 고정 (버전 번호 제외)
    archiveFileName = 'depscan-agent.jar'

    // ★ 핵심: JVM 이 이 jar 를 Agent 로 인식하려면 MANIFEST 에 Premain-Class 가 있어야 합니다.
    manifest {
        attributes(
                'Premain-Class': 'com.teams.depscan.agent.DepScanAgent',
                // 이미 실행 중인 JVM 에 붙이는 방식(attach)도 나중에 지원할 수 있도록 지정
                'Agent-Class': 'com.teams.depscan.agent.DepScanAgent',
                'Can-Retransform-Classes': 'false'
        )
    }
}
